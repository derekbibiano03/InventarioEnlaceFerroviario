name: Compilar y Publicar Actualizacion

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Restaurar appsettings.json
      run: |
        $jsonContent = '${{ secrets.APPSETTINGS_JSON }}'
        Set-Content -Path "GalloMeda.InventarioMaqunaria/appsettings.json" -Value $jsonContent -Encoding UTF8

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar NuGet
      run: dotnet restore

    - name: Compilar WPF
      run: dotnet publish GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj --configuration Release -o ./publish /p:PublishSingleFile=true /p:SelfContained=false

    - name: Comprimir ejecutable
      run: Compress-Archive -Path ./publish/* -DestinationPath ./InventarioSetup.zip

    - name: Leer version del csproj
      id: version
      run: |
        [xml]$csproj = Get-Content GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj
        $ver = $csproj.Project.PropertyGroup.Version
        echo "version=$ver" >> $env:GITHUB_OUTPUT

    - name: Publicar Release en GitHub
      uses: softprops/action-gh-release@v2
      with:
        files: ./InventarioSetup.zip
        tag_name: v${{ steps.version.outputs.version }}
        name: Versión ${{ steps.version.outputs.version }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}