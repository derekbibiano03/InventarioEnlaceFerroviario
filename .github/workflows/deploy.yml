name: Publicar en GitHub Releases

on:
  push:
    branches:
      - main

jobs:
  build-and-release:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Restaurar appsettings.json
      run: |
        $jsonContent = '${{ secrets.APPSETTINGS_JSON }}'
        Set-Content -Path "GalloMeda.InventarioMaqunaria/appsettings.json" -Value $jsonContent -Encoding UTF8

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar NuGet
      run: dotnet restore

    - name: Compilar WPF
      run: dotnet publish GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj --configuration Release -o ./publish /p:PublishSingleFile=true /p:SelfContained=false

    - name: Comprimir ejecutable
      run: Compress-Archive -Path ./publish/* -DestinationPath ./InventarioSetup.zip

    - name: Leer version y generar update.xml
      id: version
      run: |
        [xml]$csproj = Get-Content GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj
        $ver = $csproj.Project.PropertyGroup.Version
        echo "TAG=v$ver" >> $env:GITHUB_OUTPUT
        
        $xmlContent = @"
        <?xml version="1.0" encoding="utf-8"?>
        <item>
            <version>$ver</version>
            <url>https://github.com/derekbibiano03/InventarioEnlaceFerroviario/releases/latest/download/InventarioSetup.zip</url>
            <changelog>https://github.com/derekbibiano03/InventarioEnlaceFerroviario/releases</changelog>
            <mandatory>false</mandatory>
        </item>
        "@
        Set-Content -Path "./update.xml" -Value $xmlContent -Encoding UTF8

    - name: Crear Release y Subir Archivos
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.TAG }}
        name: Versión ${{ steps.version.outputs.TAG }}
        files: |
          InventarioSetup.zip
          update.xml
        body: "Actualización automática generada desde GitHub Actions."