name: Compilar y Publicar en cPanel

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: windows-latest

    steps:
    - name: Checkout del código
      uses: actions/checkout@v4

    - name: Restaurar appsettings.json
      run: |
        $jsonContent = '${{ secrets.APPSETTINGS_JSON }}'
        Set-Content -Path "GalloMeda.InventarioMaqunaria/appsettings.json" -Value $jsonContent -Encoding UTF8

    - name: Configurar .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restaurar NuGet
      run: dotnet restore

    - name: Compilar WPF
      run: dotnet publish GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj --configuration Release -o ./publish /p:PublishSingleFile=true /p:SelfContained=false

    - name: Comprimir ejecutable
      run: Compress-Archive -Path ./publish/* -DestinationPath ./InventarioSetup.zip

    - name: Leer version del csproj y generar update.xml
      id: version
      run: |
        [xml]$csproj = Get-Content GalloMeda.InventarioMaqunaria/Inventario.Desktop.csproj
        $ver = $csproj.Project.PropertyGroup.Version
        echo "version=$ver" >> $env:GITHUB_OUTPUT
        
        New-Item -ItemType Directory -Force -Path ./deploy_temp
        
        Move-Item -Path ./InventarioSetup.zip -Destination ./deploy_temp/InventarioSetup.zip
        
        $xmlContent = @"
        <?xml version="1.0" encoding="utf-8"?>
        <item>
            <version>$ver</version>
            <url>https://enlaceferroviario.com/updates/InventarioSetup.zip</url>
            <changelog>https://github.com/derekbibiano03/InventarioEnlaceFerroviario/releases</changelog>
            <mandatory>false</mandatory>
        </item>
        "@
        Set-Content -Path "./deploy_temp/update.xml" -Value $xmlContent -Encoding UTF8

    - name: Subir archivos a cPanel via SFTP
      uses: cross-the-world/ssh-scp-ssh-pipelines@latest
      with:
        host: ${{ secrets.FTP_SERVER }}
        user: ${{ secrets.FTP_USERNAME }}
        pass: ${{ secrets.FTP_PASSWORD }}
        port: 22
        local: './deploy_temp/*'
        remote: './public_html/updates/'